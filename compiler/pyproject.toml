[project]
name = "metaritual-compiler"
version = "0.1.0"
description = "Compiles metaritual IR to Ableton Live via ableton.py + OSC"
requires-python = ">=3.13"
dependencies = [
    "python-osc>=1.9.3",
]

[project.scripts]
metaritual-compile = "metaritual_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metaritual_compiler"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[package]
name = "metaritual"
version = "0.1.0"
edition = "2024"
description = "A compositional semantic musical instrument DSL"

[features]
default = []
play = ["dep:ableton"]

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ableton = { path = "../ableton-rs", optional = true }

[[bin]]
name = "live"
path = "src/bin/live.rs"
required-features = ["play"]

[dev-dependencies]
proptest = "1"
